<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/>
    </marker>
    <style>
      .box-read { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .box-write { fill: #fff8f0; stroke: #d0a880; stroke-width: 1.5; }
      .box-primary { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; }
      .title { font-size: 14px; font-weight: 600; fill: #1f2328; }
      .subtitle { font-size: 11px; fill: #656d76; }
      .model-label { font-size: 11px; font-weight: 600; fill: #656d76; }
      .agent-name { font-size: 12px; font-weight: 600; fill: #0550ae; }
      .agent-role { font-size: 10px; fill: #656d76; }
      .note { font-size: 11px; fill: #656d76; }
    </style>
  </defs>

  <!-- top requirement -->
  <text x="360" y="28" text-anchor="middle" class="title">你的一句话需求</text>
  <line x1="360" y1="38" x2="360" y2="56" stroke="#656d76" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- primary agent -->
  <rect class="box-primary" x="275" y="60" width="170" height="56" rx="8"/>
  <text x="360" y="82" text-anchor="middle" class="title">主 Agent</text>
  <text x="360" y="102" text-anchor="middle" class="subtitle">项目经理：拆任务 · 派活 · 整合</text>

  <!-- connector trunk -->
  <line x1="360" y1="116" x2="360" y2="148" stroke="#656d76" stroke-width="1.5"/>
  <line x1="130" y1="168" x2="590" y2="168" stroke="#656d76" stroke-width="1.5"/>
  <!-- three down lines -->
  <line x1="130" y1="168" x2="130" y2="198" stroke="#656d76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="168" x2="360" y2="198" stroke="#656d76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="168" x2="590" y2="198" stroke="#656d76" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Column 1: deepseek-flash ===== -->
  <text x="130" y="216" text-anchor="middle" class="model-label">deepseek-flash</text>
  <!-- code_mapper (read) -->
  <rect class="box-read" x="40" y="226" width="180" height="62" rx="7"/>
  <text x="130" y="248" text-anchor="middle" class="agent-name">code_mapper</text>
  <text x="130" y="266" text-anchor="middle" class="agent-role">只读探索 · 证据图绘制</text>
  <!-- implementer (write) -->
  <rect class="box-write" x="40" y="296" width="180" height="62" rx="7"/>
  <text x="130" y="318" text-anchor="middle" class="agent-name">implementer</text>
  <text x="130" y="336" text-anchor="middle" class="agent-role">执行主力 · 功能开发</text>

  <!-- ===== Column 2: deepseek-pro ===== -->
  <text x="360" y="216" text-anchor="middle" class="model-label">deepseek-pro</text>
  <!-- reviewer_module (read) -->
  <rect class="box-read" x="270" y="226" width="180" height="62" rx="7"/>
  <text x="360" y="248" text-anchor="middle" class="agent-name">reviewer_module</text>
  <text x="360" y="266" text-anchor="middle" class="agent-role">模块审查 · 找缺陷</text>
  <!-- reviewer_adversarial (read) -->
  <rect class="box-read" x="270" y="296" width="180" height="62" rx="7"/>
  <text x="360" y="318" text-anchor="middle" class="agent-name">reviewer_adversarial</text>
  <text x="360" y="336" text-anchor="middle" class="agent-role">跨模块对抗 · 架构风险</text>

  <!-- ===== Column 3: GLM-5-2 ===== -->
  <text x="590" y="216" text-anchor="middle" class="model-label">GLM-5-2</text>
  <!-- advisor (read) -->
  <rect class="box-read" x="500" y="226" width="180" height="62" rx="7"/>
  <text x="590" y="248" text-anchor="middle" class="agent-name">advisor</text>
  <text x="590" y="266" text-anchor="middle" class="agent-role">架构仲裁 · 非阻塞咨询</text>
  <!-- fixer (write) -->
  <rect class="box-write" x="500" y="296" width="180" height="62" rx="7"/>
  <text x="590" y="318" text-anchor="middle" class="agent-name">fixer</text>
  <text x="590" y="336" text-anchor="middle" class="agent-role">高级攻坚 · 救场恢复</text>

  <!-- caption -->
  <text x="360" y="402" text-anchor="middle" class="note">并行子 Agent：彼此平级，仅接收主 Agent 指令</text>
  <text x="360" y="420" text-anchor="middle" class="note">回退链：implementer 失败 2 次 → fixer；fixer 失败 → 主 Agent 兜底披露</text>

  <!-- legend -->
  <rect class="box-read" x="240" y="460" width="14" height="14" rx="3"/>
  <text x="260" y="472" class="note">只读（read-only）</text>
  <rect class="box-write" x="380" y="460" width="14" height="14" rx="3"/>
  <text x="400" y="472" class="note">可写（workspace-write）</text>
  <text x="360" y="498" text-anchor="middle" class="note">GLM-5-2 可替换为 K3 / Qwen-V3.8 / 5.6-Sol 等；路由自行配置</text>
</svg>
