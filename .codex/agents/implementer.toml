name = "implementer"
description = "Primary implementation agent. Spawn when the implementation contract, owned files, and verification criteria are already clear — the task needs hands-on building, not discovery. Owns the assigned files exclusively; other agents MUST NOT touch its scope concurrently."

model = "deepseek-flash"
model_reasoning_effort = "xhigh"
